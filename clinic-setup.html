<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-T">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Setup & Login - Digital Prescription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="text-center mb-4">
                    <img src="./assets/logo-placeholder.png" alt="Logo" style="width: 100px;">
                    <h1 class="mt-2">Digital Prescription System</h1>
                    <p class="lead">Please log in or register to continue.</p>
                </div>
                
                <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Register</button>
                    </li>
                </ul>

                <div class="tab-content card p-4" id="pills-tabContent">
                    <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                        <h3 class="card-title text-center">Doctor Login</h3>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="login-email" required>
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="login-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="pills-register" role="tabpanel">
                        <h3 class="card-title text-center">New Doctor Registration</h3>
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="register-email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="register-email" required>
                            </div>
                            <div class="mb-3">
                                <label for="register-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="register-password" minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Register</button>
                        </form>
                    </div>
                </div>

                <div id="clinic-setup-section" class="card p-4 mt-4" style="display: none;">
                    <h3 class="card-title text-center">Clinic Information Setup</h3>
                    <p class="text-center text-muted">Please provide your clinic details. This is a one-time setup.</p>
                    <form id="clinic-setup-form">
                        <div class="mb-3">
                            <label for="clinic-name" class="form-label">Clinic/Hospital Name</label>
                            <input type="text" class="form-control" id="clinic-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="doctor-name" class="form-label">Doctor's Name</label>
                            <input type="text" class="form-control" id="doctor-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="clinic-address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="clinic-address" required>
                        </div>
                        <div class="mb-3">
                            <label for="clinic-phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="clinic-phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="clinic-logo" class="form-label">Upload Logo (Optional)</label>
                            <input class="form-control" type="file" id="clinic-logo" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Clinic Info & Continue</button>
                    </form>
                </div>
                 <div id="alert-container" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
